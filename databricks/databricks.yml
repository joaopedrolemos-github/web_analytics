# Databricks Asset Bundle do Pulso Commerce.
# Host e credenciais vêm do perfil da CLI (pulso-dev) ou de variáveis de ambiente no CI;
# nunca gravar host ou token aqui.
bundle:
  name: pulso_commerce

include:
  - resources/*.yml

variables:
  catalogo:
    description: Catálogo do Unity Catalog do ambiente
    default: pulso_dev

targets:
  dev:
    mode: development
    default: true
    variables:
      catalogo: pulso_dev

  prd:
    mode: production
    variables:
      catalogo: pulso_prd
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    permissions:
      - user_name: ${workspace.current_user.userName}
        level: CAN_MANAGE
